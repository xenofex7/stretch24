name: Generate exercise images

on:
  workflow_dispatch:
    inputs:
      exercises:
        description: 'Nur diese Übungs-IDs (Komma-getrennt); leer = alle fehlenden'
        required: false
        default: ''
      quality:
        description: 'Bildqualität'
        required: false
        default: 'high'
        type: choice
        options: [low, medium, high]
      force:
        description: 'Vorhandene Bilder überschreiben'
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Bilder generieren
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Inputs via env statt direkter Interpolation in den Shell-Block
          # (verhindert Script-Injection über Freitext-Inputs).
          EXERCISES: ${{ inputs.exercises }}
          QUALITY: ${{ inputs.quality }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS="--quality=$QUALITY"
          if [ -n "$EXERCISES" ]; then ARGS="$ARGS --only=$EXERCISES"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          node tools/generate-images.mjs $ARGS

      - name: Neue Bilder verkleinern & komprimieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick pngquant
          # Nur Bilder anfassen, die dieser Lauf tatsächlich geändert hat -
          # sonst werden bei jedem Lauf alle Bilder re-encodiert und committet.
          CHANGED=$( { git diff --name-only -- 'assets/img/*.png'; git ls-files --others --exclude-standard -- 'assets/img/*.png'; } | sort -u )
          if [ -z "$CHANGED" ]; then echo "Keine geänderten Bilder."; exit 0; fi
          mkdir -p assets/img/thumb
          echo "$CHANGED" | while IFS= read -r f; do
            [ -e "$f" ] || continue
            case "$f" in assets/img/thumb/*) continue;; esac
            convert "$f" -resize '512x512>' -strip "$f"
            pngquant --force --skip-if-larger --quality=65-90 --ext .png "$f" || true
            # 256er-Thumb fürs Übungsraster (die App lädt im Raster nur diesen).
            t="assets/img/thumb/$(basename "$f")"
            convert "$f" -resize 256x256 -strip "$t"
            pngquant --force --skip-if-larger --quality=60-85 --ext .png "$t" || true
          done
          ls -la assets/img/ assets/img/thumb/

      - name: Committen & pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img sw.js
          if git diff --cached --quiet; then
            echo "Keine neuen Bilder – nichts zu committen."
            exit 0
          fi
          git commit -m "Generate AI exercise illustrations (gpt-image-1)"
          git push

      - name: Pages-Deploy anstossen
        # Pushes mit GITHUB_TOKEN lösen keine anderen Workflows aus,
        # deshalb wird das Deployment hier explizit gestartet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || true
